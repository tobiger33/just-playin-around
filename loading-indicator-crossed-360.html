<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Four Petals — Crossed 360°</title>
    <style>
      :root {
        color-scheme: light;
        background: #f6f5f2;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        background: #f6f5f2;
      }

      .loader {
        display: grid;
        place-items: center;
      }

      .stage {
        width: 4.5rem;
        height: 4.5rem;
        display: grid;
        place-items: center;
        perspective: 420px;
      }

      .assembly {
        position: relative;
        width: 4rem;
        height: 4rem;
        transform-style: preserve-3d;
        animation: turn 8s linear infinite;
      }

      .plane {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        transform-origin: center;
        backface-visibility: visible;
      }

      .plane--front {
        transform: translateZ(1px);
      }

      .plane--cross {
        transform: translateZ(1px) rotateX(90deg);
      }

      .spinner__track,
      .spinner__trace {
        fill: none;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      .spinner__track {
        stroke: #28334a;
        stroke-opacity: 0.12;
        stroke-width: 1.4;
      }

      .spinner__trace {
        stroke: #536fc4;
        stroke-width: 1.8;
        stroke-dasharray: 14 86;
        stroke-dashoffset: 100;
        animation: flow 4s linear infinite;
      }

      .plane--cross .spinner__trace {
        stroke: #8b7bc0;
        animation-delay: -2s;
      }

      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }

      @keyframes turn {
        from {
          transform: rotateX(-18deg) rotateY(0deg);
        }
        to {
          transform: rotateX(-18deg) rotateY(360deg);
        }
      }

      @keyframes flow {
        to {
          stroke-dashoffset: 0;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .assembly,
        .spinner__trace {
          animation: none;
        }

        .assembly {
          transform: rotateX(-18deg);
        }

        .spinner__trace {
          stroke-dashoffset: 0;
        }
      }
    </style>
  </head>
  <body>
