<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Four Petals — 360°</title>
    <style>
      :root {
        color-scheme: light;
        background: #f6f5f2;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        background: #f6f5f2;
      }

      .loader {
        display: grid;
        place-items: center;
        perspective: 360px;
      }

      .spinner {
        width: 4rem;
        height: 4rem;
        transform-style: preserve-3d;
        animation: turn 8s linear infinite;
        filter: drop-shadow(0 1px 2px rgb(40 51 74 / 12%));
      }

      .spinner__track,
      .spinner__trace {
        fill: none;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      .spinner__track {
        stroke: #28334a;
        stroke-opacity: 0.12;
        stroke-width: 1.4;
      }

      .spinner__trace {
        stroke: #536fc4;
        stroke-width: 1.8;
        stroke-dasharray: 14 86;
      }

      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }

      @keyframes turn {
        to {
          transform: rotateY(360deg);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .spinner {
          animation: none;
          transform: none;
        }
      }
    </style>
  </head>
  <body>
