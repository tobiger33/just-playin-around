<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Four Petals — Crossed 360°</title>
    <style>
      :root {
        color-scheme: light;
        background: #f6f5f2;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        background: #f6f5f2;
      }

      .loader {
        display: grid;
        place-items: center;
      }

      .stage {
        width: 4rem;
        height: 4rem;
      }

      picture,
      picture img {
        display: block;
        width: 100%;
        height: 100%;
      }

      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }
    </style>
  </head>
  <body>
    <main class="loader" role="status" aria-live="polite" aria-busy="true">
      <div class="stage">
        <picture>
          <source
            media="(prefers-reduced-motion: reduce)"
            srcset="assets/four-petals-crossed-360-static.svg"
          />
          <source
            type="image/webp"
            srcset="assets/four-petals-crossed-360.webp"
          />
          <img
            src="assets/four-petals-crossed-360.gif"
            width="128"
            height="128"
            alt=""
          />
        </picture>
      </div>
      <span class="sr-only">Loading</span>
    </main>
  </body>
</html>
